<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coca-Cola · Familia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Respaldo si no está public/fonts/LokiCola.ttf -->
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=block" rel="stylesheet" />
  <style>
    @font-face {
      font-family: "Loki Cola";
      src: url("./fonts/LokiCola.ttf") format("truetype");
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #e4001b; overflow: hidden; }
    canvas { display: block; }

    .cta {
      font: 28px "Loki Cola", "Yellowtail", cursive;
      color: #fff;
      background: transparent;
      border: 2px solid #fff;
      border-radius: 999px;
      padding: 8px 30px 10px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .cta:hover, .cta:focus-visible { background: #fff; color: #e4001b; transform: scale(1.05); outline: none; }
    .cta[hidden] { display: none; }

    #continue {
      position: fixed;
      left: 50%;
      bottom: 22%;
      transform: translateX(-50%);
      animation: appear 0.6s ease-out;
    }
    #continue:hover { transform: translateX(-50%) scale(1.05); }

    #over {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(120, 0, 14, 0.82);
      color: #fff;
      text-align: center;
      font-family: "Loki Cola", "Yellowtail", cursive;
      animation: appear 0.6s ease-out;
    }
    #over[hidden] { display: none; }
    #over .title { font-size: clamp(30px, 5vw, 56px); line-height: 1.15; margin: 0; }
    #over .score { font-size: clamp(22px, 3vw, 32px); margin: 0 0 8px; }

    /* Carta de Papá Oso */
    #win {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(120, 0, 14, 0.7);
      animation: appear 0.6s ease-out;
    }
    #win[hidden] { display: none; }
    .letter {
      position: relative;
      display: flex;
      gap: 28px;
      align-items: center;
      max-width: 640px;
      width: 100%;
      padding: 28px 32px;
      background: #fbf4e6;
      color: #5a0a12;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      font-family: "Loki Cola", "Yellowtail", cursive;
      animation: drop 0.8s cubic-bezier(.2, 1.4, .4, 1);
    }
    .letter .bottle { flex: none; width: 82px; height: auto; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25)); }
    /* calcomanía pegada en la esquina */
    .letter .sticker {
      position: absolute;
      top: -64px;
      right: -46px;
      width: clamp(110px, 20vw, 170px);
      transform: rotate(9deg);
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      animation: stick 0.5s 0.6s cubic-bezier(.3, 1.6, .5, 1) both;
      pointer-events: none;
    }
    .letter h2, .letter h2 + p { padding-right: 84px; }
    .letter h2 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 40px); color: #e4001b; font-weight: normal; }
    .letter p { margin: 0 0 10px; font-size: clamp(18px, 2.4vw, 23px); line-height: 1.3; }
    .letter .sign { text-align: right; font-size: clamp(22px, 3vw, 30px); margin-top: 6px; }
    .letter .score { font-size: 18px; opacity: 0.8; }
    .letter .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .letter .cta { font-size: 21px; color: #e4001b; border-color: #e4001b; padding: 6px 20px 8px; }
    .letter .cta:hover, .letter .cta:focus-visible { background: #e4001b; color: #fff; }
    @media (max-width: 520px) {
      .letter { flex-direction: column; text-align: center; }
      .letter .sticker { top: -40px; right: -12px; width: 96px; }
      .letter .bottle { width: 54px; }
      .letter h2, .letter h2 + p { padding-right: 0; }
      .letter .sign { text-align: center; }
      .letter .actions { justify-content: center; }
    }
    @keyframes stick { from { transform: rotate(30deg) scale(1.6); opacity: 0; } to { transform: rotate(9deg) scale(1); opacity: 1; } }
    @keyframes drop { from { transform: translateY(-40px) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }

    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <button id="continue" class="cta" hidden>Seguir jugando</button>
  <div id="over" hidden>
    <p class="title">Las pantallas se llevaron<br />el tiempo en familia</p>
    <p class="score" id="over-score"></p>
    <button id="restart" class="cta">Volver a jugar</button>
  </div>
  <div id="win" hidden>
    <div class="letter">
      <img class="bottle" src="img/botella.png" alt="Botella de Coca-Cola de litro y medio" />
      <img class="sticker" src="img/oso-sticker.png" alt="" />
      <div>
        <h2>¡Felicidades, familia!</h2>
        <p>Superaron las pantallas y se mantuvieron juntos. Ganaron una Coca-Cola de litro y medio para que celebren las fiestas en familia.</p>
        <p class="sign">Con cariño, Papá Oso</p>
        <p class="score" id="win-score"></p>
        <div class="actions">
          <button id="win-continue" class="cta">Seguir jugando</button>
          <button id="win-restart" class="cta">Volver a jugar</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
